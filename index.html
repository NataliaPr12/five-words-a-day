<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5 Words a Day</title>
<style>
  :root{
    --bg:#0f1117; --card:#181b24; --card2:#1f2331; --line:#2a2f3e;
    --text:#e9ecf3; --dim:#98a0b3; --accent:#7c5cff; --accent2:#2ee6a8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.6;
    min-height:100vh; padding:32px 20px 64px;
  }
  .wrap{max-width:760px;margin:0 auto}

  header{text-align:center;margin-bottom:8px}
  h1{font-size:2rem;font-weight:700;letter-spacing:-.02em}
  h1 .dot{color:var(--accent)}
  .sub{color:var(--dim);font-size:.95rem;margin-top:6px}

  .bar{
    display:flex;align-items:center;gap:14px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px 18px;margin:24px 0 8px;
  }
  .bar .day{font-weight:600;white-space:nowrap}
  .track{flex:1;height:8px;background:#262b38;border-radius:99px;overflow:hidden}
  .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .4s ease}
  .pct{color:var(--dim);font-size:.85rem;white-space:nowrap}

  .nav{display:flex;gap:10px;justify-content:center;margin:18px 0 26px;flex-wrap:wrap}
  button{
    font:inherit;font-size:.9rem;font-weight:500;cursor:pointer;
    background:var(--card2);color:var(--text);
    border:1px solid var(--line);border-radius:10px;padding:9px 16px;
    transition:background .15s,border-color .15s,transform .1s;
  }
  button:hover:not(:disabled){background:#272c3b;border-color:#3a4155}
  button:active:not(:disabled){transform:translateY(1px)}
  button:disabled{opacity:.35;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{background:#6b4af0}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:22px 24px;margin-bottom:14px;position:relative;
    animation:rise .35s ease backwards;
  }
  .card:nth-child(1){animation-delay:.02s}
  .card:nth-child(2){animation-delay:.07s}
  .card:nth-child(3){animation-delay:.12s}
  .card:nth-child(4){animation-delay:.17s}
  .card:nth-child(5){animation-delay:.22s}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .word{font-size:1.5rem;font-weight:700;letter-spacing:-.01em}
  .pos{
    font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;
    color:var(--accent2);border:1px solid #2a4a40;background:#152a24;
    padding:2px 8px;border-radius:99px;
  }
  .say{color:var(--dim);font-size:.9rem;font-style:italic}
  .def{margin-top:10px}
  .ex{
    margin-top:10px;padding-left:14px;border-left:2px solid var(--accent);
    color:var(--dim);font-style:italic;font-size:.95rem;
  }
  .learn{
    position:absolute;top:18px;right:18px;
    width:30px;height:30px;border-radius:50%;padding:0;
    display:grid;place-items:center;font-size:.95rem;line-height:1;
  }
  .learn.on{background:var(--accent2);border-color:var(--accent2);color:#06281f}

  footer{text-align:center;color:var(--dim);font-size:.85rem;margin-top:28px}
  footer a{color:var(--dim)}
  .streak{color:var(--accent2);font-weight:600}

  @media(max-width:520px){
    body{padding:20px 14px 48px}
    h1{font-size:1.6rem}
    .card{padding:18px}
    .word{font-size:1.3rem}
    .learn{top:14px;right:14px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>5 Words a Day<span class="dot">.</span></h1>
    <div class="sub">Thirty days. One hundred and fifty words. No sign-up.</div>
  </header>

  <div class="bar">
    <span class="day" id="dayLabel">Day 1</span>
    <div class="track"><div class="fill" id="fill"></div></div>
    <span class="pct" id="pct">0 / 150</span>
  </div>

  <div class="nav">
    <button id="prev">← Previous</button>
    <button id="today" class="primary">Today</button>
    <button id="next">Next →</button>
    <button id="shuffle">🎲 Random day</button>
  </div>

  <div id="cards"></div>

  <footer>
    <span id="streakLine"></span><br>
    Progress saves in this browser. <a href="#" id="reset">Reset progress</a>
  </footer>
</div>

<script src="words.js"></script>
<script>
const PER_DAY = 5;
const TOTAL_DAYS = Math.floor(WORDS.length / PER_DAY);
const KEY = 'wordaday.v1';

// Day 1 is the day the learner first opened the site, so everyone
// starts at the beginning rather than mid-course.
function state(){
  let s = null;
  try { s = JSON.parse(localStorage.getItem(KEY)); } catch(e){}
  if(!s || !s.start){
    s = { start: new Date().toISOString().slice(0,10), learned: [] };
    save(s);
  }
  if(!Array.isArray(s.learned)) s.learned = [];
  return s;
}
function save(s){ try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){} }

function todayIndex(){
  const s = state();
  const ms = new Date().setHours(0,0,0,0) - new Date(s.start+'T00:00:00').setHours(0,0,0,0);
  const d = Math.floor(ms / 86400000);
  return Math.min(Math.max(d, 0), TOTAL_DAYS - 1);
}

let day = todayIndex();

function render(){
  const s = state();
  const slice = WORDS.slice(day*PER_DAY, day*PER_DAY + PER_DAY);

  document.getElementById('dayLabel').textContent = 'Day ' + (day+1);
  document.getElementById('pct').textContent = s.learned.length + ' / ' + WORDS.length;
  document.getElementById('fill').style.width =
    (s.learned.length / WORDS.length * 100) + '%';

  document.getElementById('prev').disabled = day === 0;
  document.getElementById('next').disabled = day >= TOTAL_DAYS - 1;

  const done = s.learned.length;
  document.getElementById('streakLine').innerHTML = done
    ? 'You have marked <span class="streak">' + done + '</span> word' +
      (done===1?'':'s') + ' as learned.'
    : 'Tap the circle on a card to mark a word as learned.';

  document.getElementById('cards').innerHTML = slice.map((w, i) => {
    const gi = day*PER_DAY + i;
    const on = s.learned.includes(gi);
    return '<div class="card">' +
      '<button class="learn' + (on?' on':'') + '" data-i="' + gi + '" ' +
        'title="Mark as learned" aria-label="Mark as learned">' + (on?'✓':'') + '</button>' +
      '<div class="top">' +
        '<span class="word">' + esc(w[0]) + '</span>' +
        '<span class="pos">' + esc(w[1]) + '</span>' +
        '<span class="say">/' + esc(w[2]) + '/</span>' +
      '</div>' +
      '<div class="def">' + esc(w[3]) + '</div>' +
      '<div class="ex">' + esc(w[4]) + '</div>' +
    '</div>';
  }).join('');

  document.querySelectorAll('.learn').forEach(b => {
    b.onclick = () => {
      const s = state(), i = +b.dataset.i;
      const at = s.learned.indexOf(i);
      if(at === -1) s.learned.push(i); else s.learned.splice(at,1);
      save(s); render();
    };
  });
}

function esc(t){
  return String(t).replace(/[&<>"]/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

document.getElementById('prev').onclick    = () => { if(day>0){ day--; render(); } };
document.getElementById('next').onclick    = () => { if(day<TOTAL_DAYS-1){ day++; render(); } };
document.getElementById('today').onclick   = () => { day = todayIndex(); render(); };
document.getElementById('shuffle').onclick = () => {
  day = Math.floor(Math.random()*TOTAL_DAYS); render();
};
document.getElementById('reset').onclick = e => {
  e.preventDefault();
  if(confirm('Reset all progress and start again at Day 1?')){
    localStorage.removeItem(KEY); day = 0; render();
  }
};

document.addEventListener('keydown', e => {
  if(e.key === 'ArrowLeft')  document.getElementById('prev').click();
  if(e.key === 'ArrowRight') document.getElementById('next').click();
});

render();
</script>
</body>
</html>
